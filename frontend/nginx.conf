server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container to avoid CORS issues if needed,
    # but since we configured CORS on the backend and talk directly to it, this is optional.
    # location /api/ {
    #     proxy_pass http://backend:8000;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
